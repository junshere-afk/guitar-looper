<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오디오 녹음 테스트</title>
<style>body{margin:0;background:#0b1220;color:#eaf2ff;font:16px system-ui,sans-serif}main{max-width:720px;margin:32px auto;padding:0 18px}section{background:#14213a;border:1px solid #344b70;border-radius:12px;padding:18px;margin:14px 0}button,select,a{font:inherit}button,select{background:#203554;color:white;border:1px solid #56739e;border-radius:7px;padding:10px}button:disabled{opacity:.45}select{width:100%;margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}meter{width:100%;height:22px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a1323;padding:12px;border-radius:8px}audio{width:100%}a{color:#8dc4ff}small{color:#b2c5df}</style></head>
<body><main><h1>오디오 녹음 테스트</h1><p>입력은 녹음과 미터에만 사용하며 실시간 출력하지 않습니다.</p><section><button id="permission">마이크 권한 요청 및 장치 목록 불러오기</button><p>메인 입력 (스테레오 · Loopback)</p><select id="devices" aria-label="메인 입력" disabled></select><label>메인 게인 <input id="mainGain" type="range" min="-24" max="24" value="0"><output id="mainValue">0 dB</output></label><p>메인 레벨 <meter id="level" min="0" max="1" value="0"></meter></p><label><input type="checkbox" id="auxEnabled"> 보조 입력 사용</label><p>보조 입력 (In 1-2)</p><select id="auxDevice" aria-label="보조 입력" disabled></select><label>채널 <select id="auxChannel" disabled><option value="0">채널 1</option><option value="1">채널 2</option></select></label><label>보조 게인 <input id="auxGain" type="range" min="-24" max="24" value="0"><output id="auxValue">0 dB</output></label><p>보조 레벨 <meter id="auxLevel" min="0" max="1" value="0"></meter></p><p>최종 믹스 레벨 <meter id="mixLevel" min="0" max="1" value="0"></meter></p><div class="row"><button id="connect" disabled>선택한 입력 연결</button></div><p>실제 적용된 오디오 설정</p><pre id="settings">입력을 연결하면 표시됩니다.</pre><p id="status" role="status">마이크 권한을 요청하세요.</p></section><section><div class="row"><button id="start" disabled>녹음 시작</button><button id="stop" disabled>녹음 정지</button></div><audio id="playback" controls></audio><p><a id="download" hidden>녹음 파일 다운로드</a></p></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id), constraints={echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:{ideal:2}};
let stream=null,auxStream=null,context=null,source=null,analyser=null,auxAnalyser=null,mixAnalyser=null,destination=null,mainGain=null,auxGain=null,frame=null,recorder=null,chunks=[],recordingUrl=null,connecting=false;
const status=message=>{$('status').textContent=message};
async function listDevices(){const inputs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');for(const id of ['devices','auxDevice']){const select=$(id),previous=select.value;select.replaceChildren();for(const [i,d] of inputs.entries()){const option=document.createElement('option');option.value=d.deviceId;option.textContent=d.label||`입력 장치 ${i+1}`;select.append(option)}if(inputs.some(d=>d.deviceId===previous))select.value=previous}$('devices').disabled=!inputs.length;$('connect').disabled=!inputs.length;$('auxDevice').disabled=!inputs.length||!$('auxEnabled').checked;$('auxChannel').disabled=!inputs.length||!$('auxEnabled').checked;return inputs.length}
function disconnect(){if(frame!==null)cancelAnimationFrame(frame);frame=null;for(const input of [stream,auxStream])if(input)input.getTracks().forEach(t=>t.stop());stream=auxStream=null;if(context)context.close().catch(()=>{});context=source=analyser=auxAnalyser=mixAnalyser=destination=mainGain=auxGain=null;for(const id of ['level','auxLevel','mixLevel'])$(id).value=0;$('start').disabled=true}
function measure(){if(!context)return;for(const [node,id] of [[analyser,'level'],[auxAnalyser,'auxLevel'],[mixAnalyser,'mixLevel']]){if(!node){$(id).value=0;continue}const data=new Float32Array(node.fftSize);node.getFloatTimeDomainData(data);let peak=0;for(const value of data)peak=Math.max(peak,Math.abs(value));$(id).value=peak}frame=requestAnimationFrame(measure)}
async function connect(){if(connecting||recorder?.state==='recording')return;connecting=true;$('connect').disabled=true;disconnect();try{stream=await navigator.mediaDevices.getUserMedia({audio:{...constraints,deviceId:{exact:$('devices').value}},video:false});if($('auxEnabled').checked){try{auxStream=await navigator.mediaDevices.getUserMedia({audio:{...constraints,deviceId:{exact:$('auxDevice').value}},video:false})}catch(error){throw Error('두 입력 장치 동시 접근 실패: '+error.message)}}context=new AudioContext();destination=context.createMediaStreamDestination();destination.channelCount=2;source=context.createMediaStreamSource(stream);mainGain=context.createGain();mainGain.gain.value=10**(Number($('mainGain').value)/20);analyser=context.createAnalyser();mixAnalyser=context.createAnalyser();source.connect(mainGain);mainGain.connect(analyser);mainGain.connect(mixAnalyser);if(auxStream){const auxSource=context.createMediaStreamSource(auxStream),split=context.createChannelSplitter(2),merge=context.createChannelMerger(2),channel=Number($('auxChannel').value);auxGain=context.createGain();auxGain.gain.value=10**(Number($('auxGain').value)/20);auxAnalyser=context.createAnalyser();auxSource.connect(split);split.connect(merge,channel,0);split.connect(merge,channel,1);merge.connect(auxGain);auxGain.connect(auxAnalyser);auxGain.connect(mixAnalyser)}mixAnalyser.connect(destination);await context.resume();const describe=input=>{const track=input.getAudioTracks()[0];return {device:track.label,...track.getSettings()}};$('settings').textContent=JSON.stringify({main:describe(stream),aux:auxStream?describe(auxStream):null,selectedAuxChannel:auxStream?Number($('auxChannel').value)+1:null,mixChannels:destination.channelCount},null,2);for(const input of [stream,auxStream])if(input)input.getAudioTracks()[0].addEventListener('ended',()=>{if(recorder?.state==='recording')recorder.stop();disconnect();status('입력 장치 연결이 종료되었습니다.')},{once:true});$('start').disabled=false;status('입력 연결됨 · 실제 입력 채널 수와 설정을 확인하세요.');measure()}catch(error){disconnect();status('입력 연결 실패: '+error.message)}finally{connecting=false;$('connect').disabled=false}}
$('auxEnabled').onchange=()=>{const enabled=$('auxEnabled').checked;$('auxDevice').disabled=!enabled;$('auxChannel').disabled=!enabled;if(auxGain&&context)auxGain.gain.setValueAtTime(enabled?10**(Number($('auxGain').value)/20):0,context.currentTime);if(enabled&&!auxStream&&stream)status('보조 입력을 사용하려면 입력을 다시 연결하세요.')};
for(const [control,label] of [['mainGain','mainValue'],['auxGain','auxValue']])$(control).oninput=()=>{$(label).textContent=$(control).value+' dB';const node=control==='mainGain'?mainGain:auxGain;if(node&&context)node.gain.setValueAtTime(control==='auxGain'&&!$('auxEnabled').checked?0:10**(Number($(control).value)/20),context.currentTime)};
$('auxChannel').onchange=()=>{if(stream)status('채널을 변경하려면 입력을 다시 연결하세요.')};
$('permission').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS 또는 localhost에서 지원되는 브라우저가 필요합니다.');const temp=await navigator.mediaDevices.getUserMedia({audio:constraints,video:false});temp.getTracks().forEach(t=>t.stop());const count=await listDevices();status(count?'장치를 선택하고 입력 연결을 누르세요.':'사용 가능한 입력 장치가 없습니다.')}catch(error){status('마이크 권한 요청 실패: '+error.message)}};
$('connect').onclick=connect;
$('start').onclick=()=>{if(!destination)return;try{const types=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4'];const type=types.find(t=>MediaRecorder.isTypeSupported(t));recorder=type?new MediaRecorder(destination.stream,{mimeType:type}):new MediaRecorder(destination.stream);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(recordingUrl)URL.revokeObjectURL(recordingUrl);recordingUrl=URL.createObjectURL(blob);$('playback').src=recordingUrl;const extension=blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm';$('download').href=recordingUrl;$('download').download=`recording.${extension}`;$('download').hidden=false;$('start').disabled=!destination;$('stop').disabled=true;$('connect').disabled=false;$('devices').disabled=false;$('auxEnabled').disabled=false;$('auxDevice').disabled=!$('auxEnabled').checked;$('auxChannel').disabled=!$('auxEnabled').checked;status('녹음 완료 · 재생하거나 파일을 다운로드하세요.')};recorder.onerror=e=>status('녹음 오류: '+(e.error?.message||'알 수 없는 오류'));recorder.start();$('start').disabled=true;$('stop').disabled=false;$('connect').disabled=true;$('devices').disabled=true;$('auxDevice').disabled=true;$('auxChannel').disabled=true;$('auxEnabled').disabled=true;status('녹음 중 · '+recorder.mimeType)}catch(error){status('녹음을 시작할 수 없습니다: '+error.message)}};
$('stop').onclick=()=>{if(recorder?.state==='recording')recorder.stop()};
window.addEventListener('pagehide',()=>{if(recorder?.state==='recording')recorder.stop();disconnect();if(recordingUrl)URL.revokeObjectURL(recordingUrl)});
</script></body></html>
