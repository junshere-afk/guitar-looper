<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오디오 녹음 테스트</title>
<style>body{margin:0;background:#0b1220;color:#eaf2ff;font:16px system-ui,sans-serif}main{max-width:720px;margin:32px auto;padding:0 18px}section{background:#14213a;border:1px solid #344b70;border-radius:12px;padding:18px;margin:14px 0}button,select,a{font:inherit}button,select{background:#203554;color:white;border:1px solid #56739e;border-radius:7px;padding:10px}button:disabled{opacity:.45}select{width:100%;margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}meter{width:100%;height:22px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a1323;padding:12px;border-radius:8px}audio{width:100%}a{color:#8dc4ff}small{color:#b2c5df}</style></head>
<body><main><h1>오디오 녹음 테스트</h1><p>입력 신호는 레벨 미터에만 사용하며 실시간으로 출력하지 않습니다.</p><section><button id="permission">마이크 권한 요청 및 장치 목록 불러오기</button><label for="devices"><p>녹음 입력 장치</p></label><select id="devices" disabled></select><small>MOTU M4 Loopback 또는 Loopback Mix를 선택하세요. 표시 이름은 운영체제와 드라이버에 따라 다를 수 있습니다.</small><div class="row"><button id="connect" disabled>선택한 입력 연결</button></div><label for="level">입력 레벨</label><meter id="level" min="0" max="1" value="0"></meter><p>실제 적용된 오디오 설정</p><pre id="settings">입력을 연결하면 표시됩니다.</pre><p id="status" role="status">마이크 권한을 요청하세요.</p></section><section><div class="row"><button id="start" disabled>녹음 시작</button><button id="stop" disabled>녹음 정지</button></div><audio id="playback" controls></audio><p><a id="download" hidden>녹음 파일 다운로드</a></p></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id), constraints={echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:{ideal:2}};
let stream=null,context=null,source=null,analyser=null,frame=null,recorder=null,chunks=[],recordingUrl=null;
const status=message=>{$('status').textContent=message};
async function listDevices(){const inputs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');const previous=$('devices').value;$('devices').replaceChildren();for(const [i,d] of inputs.entries()){const option=document.createElement('option');option.value=d.deviceId;option.textContent=d.label||`입력 장치 ${i+1}`;$('devices').append(option)}if(inputs.some(d=>d.deviceId===previous))$('devices').value=previous;$('devices').disabled=!inputs.length;$('connect').disabled=!inputs.length;return inputs.length}
function disconnect(){if(frame!==null)cancelAnimationFrame(frame);frame=null;if(source)source.disconnect();source=null;analyser=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(context)context.close().catch(()=>{});context=null;$('level').value=0;$('start').disabled=true}
function measure(){if(!analyser)return;const data=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(data);let peak=0;for(const value of data)peak=Math.max(peak,Math.abs(value));$('level').value=peak;frame=requestAnimationFrame(measure)}
async function connect(){if(recorder&&recorder.state!=='inactive')return;disconnect();try{const id=$('devices').value;stream=await navigator.mediaDevices.getUserMedia({audio:{...constraints,deviceId:{exact:id}},video:false});const track=stream.getAudioTracks()[0];track.addEventListener('ended',()=>{disconnect();status('입력 장치 연결이 종료되었습니다.')},{once:true});context=new AudioContext();source=context.createMediaStreamSource(stream);analyser=context.createAnalyser();analyser.fftSize=2048;source.connect(analyser);await context.resume();const applied=track.getSettings();$('settings').textContent=JSON.stringify({device:track.label,...applied},null,2);$('start').disabled=false;status(applied.channelCount===2?'입력 연결됨 · 스테레오':'입력 연결됨 · 실제 채널 수를 확인하세요.');measure()}catch(error){disconnect();status('입력 연결 실패: '+error.message)}}
$('permission').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS 또는 localhost에서 지원되는 브라우저가 필요합니다.');const temp=await navigator.mediaDevices.getUserMedia({audio:constraints,video:false});temp.getTracks().forEach(t=>t.stop());const count=await listDevices();status(count?'장치를 선택하고 입력 연결을 누르세요.':'사용 가능한 입력 장치가 없습니다.')}catch(error){status('마이크 권한 요청 실패: '+error.message)}};
$('connect').onclick=connect;
$('start').onclick=()=>{if(!stream)return;try{const types=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4'];const type=types.find(t=>MediaRecorder.isTypeSupported(t));recorder=type?new MediaRecorder(stream,{mimeType:type}):new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(recordingUrl)URL.revokeObjectURL(recordingUrl);recordingUrl=URL.createObjectURL(blob);$('playback').src=recordingUrl;const extension=blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm';$('download').href=recordingUrl;$('download').download=`recording.${extension}`;$('download').hidden=false;$('start').disabled=!stream;$('stop').disabled=true;$('connect').disabled=false;$('devices').disabled=false;status('녹음 완료 · 재생하거나 파일을 다운로드하세요.')};recorder.onerror=e=>status('녹음 오류: '+(e.error?.message||'알 수 없는 오류'));recorder.start();$('start').disabled=true;$('stop').disabled=false;$('connect').disabled=true;$('devices').disabled=true;status('녹음 중 · '+recorder.mimeType)}catch(error){status('녹음을 시작할 수 없습니다: '+error.message)}};
$('stop').onclick=()=>{if(recorder?.state==='recording')recorder.stop()};
window.addEventListener('pagehide',()=>{if(recorder?.state==='recording')recorder.stop();disconnect();if(recordingUrl)URL.revokeObjectURL(recordingUrl)});
</script></body></html>
