<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Guitar Looper</title>
  <link rel="stylesheet" href="style.css">
  <style>.recent-wrap{position:relative}.recent-menu{position:absolute;z-index:4;top:calc(100% + 8px);right:0;width:min(440px,100%);max-height:320px;overflow:auto;padding:8px;border:1px solid #38537c;border-radius:10px;background:#101a2d;box-shadow:0 14px 30px #0008}.recent-item{display:flex;gap:7px;align-items:center}.recent-select{flex:1;min-width:0;text-align:left}.recent-title,.recent-meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.recent-meta{margin-top:3px;color:#a9c0df;font-size:12px}.recent-delete{min-height:36px;padding:6px 10px}.recent-empty{padding:12px;color:#a9c0df;font-size:13px;text-align:center}</style>
</head>
<body>
  <main class="app" id="appShell" tabindex="-1">
    <header class="topbar">
      <div><h1>Guitar Looper</h1><p>유튜브 기타 카피를 위한 자유 AB 반복</p></div>
      <button id="fullscreenBtn" type="button">전체화면</button>
    </header>

    <section class="load-card" aria-label="영상 불러오기">
      <label for="videoUrl">YouTube URL</label>
      <div class="url-row"><input id="videoUrl" autocomplete="url" spellcheck="false" value="https://www.youtube.com/watch?v=8-Li_sFNc4Q" placeholder="YouTube 영상 URL"><button id="loadBtn" class="primary" type="button">영상 불러오기</button><div class="recent-wrap"><button id="recentBtn" type="button" aria-expanded="false">최근 영상</button><div id="recentMenu" class="recent-menu" hidden></div></div></div>
      <p class="hint" id="loadStatus">일반 YouTube URL과 youtu.be 단축 URL을 지원합니다.</p>
    </section>

    <section class="player-card" id="playerCard">
      <div class="video-title"><strong id="videoTitle">영상 준비 중</strong><span id="playerStatus">YouTube API 연결 대기 중</span><span id="volumeStatus" aria-live="polite" hidden></span></div>
      <div class="player-wrap" id="playerWrap"><div id="player"></div><button id="keyboardFocus" type="button" title="영상 클릭 후 단축키가 안 되면 누르세요">키보드 제어</button></div>
      <div class="mode-row"><span id="modeStatus" class="mode">자유 재생</span><span id="abStatus">[ 키로 A 지점을 지정하세요.</span></div>
      <div class="transport">
        <button id="playBtn" class="primary" type="button">재생</button><button id="freeBtn" type="button">자유재생</button><button id="backBtn" type="button">A로 이동</button>
        <label>속도 <select id="speed"><option value="0.50">0.50×</option><option value="0.55">0.55×</option><option value="0.60">0.60×</option><option value="0.65">0.65×</option><option value="0.70">0.70×</option><option value="0.75">0.75×</option><option value="0.80">0.80×</option><option value="0.85">0.85×</option><option value="0.90">0.90×</option><option value="0.95">0.95×</option><option value="1.00" selected>1.00×</option><option value="1.05">1.05×</option><option value="1.10">1.10×</option><option value="1.15">1.15×</option><option value="1.20">1.20×</option><option value="1.25">1.25×</option><option value="1.30">1.30×</option><option value="1.35">1.35×</option><option value="1.40">1.40×</option><option value="1.45">1.45×</option><option value="1.50">1.50×</option></select><span id="speedApplied" aria-live="polite">적용 속도 1.00×</span></label>
      </div>
      <div class="ab-times"><div><b>A</b> <span id="aTime">--:--.-</span></div><div><b>B</b> <span id="bTime">--:--.-</span></div></div>
      <div class="adjust-grid" aria-label="AB 구간 미세 조정"><button data-adjust="a:-0.1" type="button">A −0.1초</button><button data-adjust="a:0.1" type="button">A +0.1초</button><button data-adjust="b:-0.1" type="button">B −0.1초</button><button data-adjust="b:0.1" type="button">B +0.1초</button></div>
      <p class="keys">단축키: <kbd>[</kbd> A 지정 · <kbd>]</kbd> B 지정/반복 · <kbd>\</kbd> 자유재생 · <kbd>←</kbd>/<kbd>→</kbd> 5초 이동 · <kbd>Backspace</kbd> A로 이동 · <kbd>X</kbd>/<kbd>C</kbd> 속도 −/+0.05× · <kbd>Z</kbd> 1.00×</p>
    </section>

    <section class="segments-card">
      <div class="section-head"><div><h2>저장된 AB 구간</h2><p id="segmentMeta">현재 영상의 구간을 불러오는 중입니다.</p></div><div class="backup-actions"><button id="exportBtn" type="button">JSON 내보내기</button><button id="importBtn" type="button">JSON 가져오기</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></div>
      <div class="save-form"><label for="segmentName">구간 이름</label><input id="segmentName" maxlength="80" placeholder="예: 인트로 리프"><button id="saveBtn" class="primary" type="button">구간 저장</button><button id="updateBtn" type="button" disabled>선택 구간 업데이트</button><button id="deleteBtn" class="danger" type="button" disabled>선택 구간 삭제</button></div>
      <div id="segmentList" class="segment-list" aria-live="polite"></div>
    </section>
  </main>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
